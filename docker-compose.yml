# Runs the victim API for the extraction experiments.
#
# data/logs is bind-mounted rather than kept in a named volume so the detector
# and the dashboard can read requests.jsonl directly from the host while the
# container is still serving traffic.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: extraction-detector-api:latest
    container_name: extraction-detector-api
    ports:
      - "8000:8000"
    volumes:
      - ./data/logs:/app/data/logs
    environment:
      LOG_PATH: /app/data/logs/requests.jsonl
    restart: unless-stopped
