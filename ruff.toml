# Lint config for extraction-detector.
#
# Line length matches the project's own style (long, well-commented lines),
# not ruff's 88-char default, which would flag most of this repo for no
# real reason.

line-length = 100
target-version = "py311"

[lint]
# E: pycodestyle errors, F: pyflakes (unused imports, undefined names, etc.),
# I: import sorting, UP: modern-Python upgrades, B: common bug patterns.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length: many lines here are long comments explaining why,
              # not code that should wrap
    "UP031",  # printf-style % formatting: used deliberately and consistently
              # throughout this codebase; not a bug, just a style choice
]

[lint.per-file-ignores]
# noqa: E402 markers throughout the project put sys.path.insert before an
# import on purpose, so every script that does this needs E402 silenced.
"detector/*.py" = ["E402"]
"traffic/*.py" = ["E402"]
"eval/*.py" = ["E402"]
"api/main.py" = ["E402"]
"tests/*.py" = ["E402"]
